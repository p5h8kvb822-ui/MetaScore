name: Predictions du jour

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date AAAA-MM-JJ (vide = aujourd'hui)"
        required: false
        default: ""
      publish:
        description: "Publier sur Instagram (true) ou seulement generer les images (false)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  pronostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generer les images de predictions
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          MATCH_DATE: ${{ github.event.inputs.date }}
        run: python pronostics.py
      - name: Enregistrer les images dans le depot
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A published
          git commit -m "Predictions du jour" || echo "Rien a enregistrer"
          git pull --rebase
          git push
      - name: Publier sur Instagram
        if: ${{ github.event.inputs.publish != 'false' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -f published/latest_pronostics.txt ]; then
            MANIFEST=$(cat published/latest_pronostics.txt)
            export IMAGE_BASE_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/$(dirname "$MANIFEST")"
            python post_instagram.py "$MANIFEST"
          else
            echo "Aucune prediction a publier."
          fi
